<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151b"><meta name="description" content="Ghaz Amin Poetry Studio, a private poetry poster maker.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2311151b'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='52' fill='%23f5efe3'%3Eg%3C/text%3E%3C/svg%3E">
<title>ghaz.amin | Poetry Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e12;--panel:#14181e;--panel2:#191e25;--line:#2a3038;--text:#f4f0e8;--muted:#9299a4;--accent:#d8c49b;--danger:#b87878}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:350px 1fr;min-height:100vh}.sidebar{padding:20px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}.brand{font-family:'Cormorant Garamond',serif;font-size:32px;line-height:1}.tag{color:var(--muted);font-size:11px;margin:4px 0 20px}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin:0 0 7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}input[type=text],textarea,select{width:100%;background:#0e1217;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;outline:none}textarea{min-height:220px;resize:vertical;line-height:1.5}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:10px}.btn:hover{border-color:#555d67}.btn.primary{background:var(--accent);border-color:var(--accent);color:#16130f;font-weight:600}.btn.danger{color:#e0aaaa}.range{width:100%;accent-color:var(--accent)}.check{display:flex;gap:8px;align-items:center;color:#d8dbe0;font-size:13px;margin-top:10px}.saved{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.saved span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.saved button{background:none;border:0;color:var(--accent);font-size:12px}.workspace{min-width:0;display:flex;flex-direction:column}.toolbar{height:58px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{color:var(--muted);font-size:12px}.toolbar .btns{width:240px}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:25px;overflow:auto;background:radial-gradient(circle at 50% 20%,#202832 0,#0b0e12 55%)}.canvas{position:relative;width:min(700px,88vw);aspect-ratio:4/5;background:#222;overflow:hidden;box-shadow:0 25px 80px #000b}.canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 78%)}.title,.poem{position:absolute;left:10%;width:80%;cursor:grab;white-space:pre-wrap;text-shadow:0 2px 12px #0008}.title{font-family:'Cormorant Garamond',serif;font-size:48px;line-height:1.02;font-weight:600}.poem{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.42}.credit{position:absolute;bottom:4%;left:10%;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.78}.dragging{cursor:grabbing}.status{font-size:11px;color:var(--muted);line-height:1.4}.install{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{order:2;border-right:0;border-top:1px solid var(--line)}.workspace{min-height:70vh}.toolbar{position:sticky;top:0;z-index:5}.stage{padding:12px}.canvas{width:min(650px,94vw)}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand">ghaz.amin</div><div class="tag">Poetry Studio · private archive</div>
<div class="section"><div class="label">Background</div><input id="photo" type="file" accept="image/*"><div style="height:8px"></div><button class="btn" id="sample">Use Gadis Kataha photo</button></div>
<div class="section"><div class="label">Title</div><input id="titleInput" type="text" value="Gadis Kataha Itu"></div>
<div class="section"><div class="label">Poem</div><textarea id="poemInput">Gadis Kataha itu,
datang tanpa mengetuk pintu,
namun entah bagaimana
berjaya membuka ruang
yang telah lama ku kunci.

Dia mencuri pandang kepadaku
tatkala aku telah menutup mata,
seolah-olah ingin mengenaliku
tanpa mahu ku tahu.

Namun malangnya,
ada mata yang terpejam
tetapi hati tidak pernah tidur.

Aku tahu.

Dan sejak itu,
hati yang pernah aku kemas rapi
mula berselerak
dek satu senyuman kecil daripadanya.</textarea></div>
<div class="section"><div class="label">Pen name</div><input id="penName" type="text" value="ghaz.amin"></div>
<div class="section"><div class="label">Typography</div><select id="font"><option>Cormorant Garamond</option><option>Playfair Display</option><option>DM Sans</option></select><div style="height:10px"></div><div class="row"><div><div class="label">Title</div><input id="titleSize" class="range" type="range" min="24" max="80" value="48"></div><div><div class="label">Poem</div><input id="poemSize" class="range" type="range" min="12" max="34" value="20"></div></div><label class="check"><input id="shadeToggle" type="checkbox" checked> Dark overlay</label></div>
<div class="section"><div class="label">Layout</div><div class="btns"><button class="btn" id="resetPos">Reset</button><button class="btn" id="centerPoem">Lower text</button></div><div class="status" style="margin-top:8px">Drag the title and poem directly on the poster.</div></div>
<div class="section"><div class="label">Archive</div><input id="saveName" type="text" placeholder="Poem name"><div style="height:8px"></div><button class="btn primary" id="save">Save to this browser</button><div id="savedList"></div></div>
<div class="section"><button class="btn" id="installBtn" style="width:100%;display:none">Install ghaz.amin Studio</button></div>
</aside>
<main class="workspace"><div class="toolbar"><div class="hint">Upload → write → drag → export. Nothing is uploaded to a server.</div><div class="btns"><button class="btn" id="clear">Clear</button><button class="btn primary" id="export">Export PNG</button></div></div><div class="stage"><div class="canvas" id="canvas"><img id="bg" src="sample.jpg" alt=""><div class="shade" id="shade"></div><div class="title" id="title"></div><div class="poem" id="poem"></div><div class="credit" id="credit"></div></div></div></main></div>
<script>
const $=id=>document.getElementById(id);let positions={title:{x:10,y:10},poem:{x:10,y:23}},bgData=null;
function render(){title.textContent=titleInput.value||'Untitled';poem.textContent=poemInput.value;credit.textContent='SEBUAH PUISI OLEH '+(penName.value||'ghaz.amin');for(const id of ['title','poem']){$(id).style.fontFamily=`'${font.value}'`;$(id).style.left=positions[id].x+'%';$(id).style.top=positions[id].y+'%'}title.style.fontSize=titleSize.value+'px';poem.style.fontSize=poemSize.value+'px';shade.style.display=shadeToggle.checked?'block':'none'}
['titleInput','poemInput','penName','font','titleSize','poemSize','shadeToggle'].forEach(id=>$(id).addEventListener('input',render));
photo.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{bg.src=r.result;bgData=r.result};r.readAsDataURL(f)};sample.onclick=()=>{bg.src='sample.jpg';bgData=null};resetPos.onclick=()=>{positions={title:{x:10,y:10},poem:{x:10,y:23}};render()};centerPoem.onclick=()=>{positions.poem.y=42;render()};clear.onclick=()=>{titleInput.value='';poemInput.value='';render()};
function drag(el,key){let sx,sy,ox,oy;el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.classList.add('dragging');sx=e.clientX;sy=e.clientY;ox=positions[key].x;oy=positions[key].y});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const r=canvas.getBoundingClientRect();positions[key].x=Math.max(2,Math.min(75,ox+(e.clientX-sx)/r.width*100));positions[key].y=Math.max(2,Math.min(90,oy+(e.clientY-sy)/r.height*100));render()});el.addEventListener('pointerup',()=>el.classList.remove('dragging'))}drag(title,'title');drag(poem,'poem');
function getSaved(){return JSON.parse(localStorage.getItem('ghaz-amin-poems')||'[]')}function setSaved(a){localStorage.setItem('ghaz-amin-poems',JSON.stringify(a))}function listSaved(){const a=getSaved();savedList.innerHTML=a.length?'':'<div class="status" style="margin-top:10px">No saved poems yet.</div>';a.forEach((p,i)=>{const d=document.createElement('div');d.className='saved';const s=document.createElement('span');s.textContent=p.name;const b=document.createElement('button');b.textContent='Load';b.onclick=()=>{titleInput.value=p.title;poemInput.value=p.poem;penName.value=p.penName;font.value=p.font;titleSize.value=p.titleSize;poemSize.value=p.poemSize;positions=p.positions;render()};d.append(s,b);savedList.appendChild(d)})}save.onclick=()=>{const a=getSaved();a.unshift({name:saveName.value||titleInput.value||'Untitled',title:titleInput.value,poem:poemInput.value,penName:penName.value,font:font.value,titleSize:titleSize.value,poemSize:poemSize.value,positions});setSaved(a);saveName.value='';listSaved()};
async function waitForImage(img){
  if(img.complete && img.naturalWidth > 0) return;
  await new Promise((resolve,reject)=>{
    img.addEventListener('load',resolve,{once:true});
    img.addEventListener('error',()=>reject(new Error('Background image could not be loaded.')),{once:true});
  });
}

async function waitForFonts(){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
}

function loadImageForExport(source){
  return new Promise((resolve,reject)=>{
    const image = new Image();
    image.onload = ()=>resolve(image);
    image.onerror = ()=>reject(new Error('Could not load the background image for export.'));
    image.src = source;
  });
}

function drawTextBlock(ctx, text, x, y, maxWidth, lineHeight){
  const lines = String(text || '').split('\n');
  let cy = y;
  for(const rawLine of lines){
    // Preserve intentional blank lines.
    if(rawLine === ''){
      cy += lineHeight;
      continue;
    }

    // Wrap long lines so they stay inside the poster.
    const words = rawLine.split(/\s+/);
    let line = '';
    for(const word of words){
      const test = line ? line + ' ' + word : word;
      if(ctx.measureText(test).width > maxWidth && line){
        ctx.fillText(line,x,cy);
        cy += lineHeight;
        line = word;
      }else{
        line = test;
      }
    }
    if(line){
      ctx.fillText(line,x,cy);
      cy += lineHeight;
    }
  }
}

export.onclick=async()=>{
  const button = export;
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = 'Exporting…';

  try{
    await waitForImage(bg);
    await waitForFonts();

    const source = bg.src;
    if(!source) throw new Error('No background image selected.');

    const img = await loadImageForExport(source);

    const W = 1440;
    const H = 1800;
    const out = document.createElement('canvas');
    out.width = W;
    out.height = H;

    const ctx = out.getContext('2d', {alpha:false});
    if(!ctx) throw new Error('Your browser could not create the export canvas.');

    // Background: same cover behaviour as the editor.
    const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);

    // Overlay.
    if(shadeToggle.checked){
      const gradient = ctx.createLinearGradient(0,0,W,0);
      gradient.addColorStop(0,'rgba(0,0,0,.55)');
      gradient.addColorStop(.78,'rgba(0,0,0,.05)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0,0,W,H);
    }

    const titleFont = font.value || 'Cormorant Garamond';
    const titlePx = Number(titleSize.value) * 2;
    const poemPx = Number(poemSize.value) * 2;
    const x = positions.title.x / 100 * W;
    const titleY = positions.title.y / 100 * H;
    const poemX = positions.poem.x / 100 * W;
    const poemY = positions.poem.y / 100 * H;

    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f4f0e8';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 16;

    // Title
    ctx.font = `600 ${titlePx}px "${titleFont}"`;
    ctx.fillText(titleInput.value || 'Untitled', x, titleY);

    // Poem
    ctx.font = `400 ${poemPx}px "${titleFont}"`;
    ctx.shadowBlur = 10;
    drawTextBlock(ctx, poemInput.value, poemX, poemY, W * 0.80, poemPx * 1.42);

    // Pen name
    ctx.shadowBlur = 0;
    ctx.globalAlpha = .78;
    ctx.font = `500 20px "DM Sans"`;
    ctx.fillText(
      ('SEBUAH PUISI OLEH ' + (penName.value || 'ghaz.amin')).toUpperCase(),
      poemX,
      H * .95
    );
    ctx.globalAlpha = 1;

    // Use toBlob instead of toDataURL for a more reliable download.
    const blob = await new Promise((resolve,reject)=>{
      out.toBlob(b=>{
        if(b) resolve(b);
        else reject(new Error('PNG creation failed.'));
      },'image/png');
    });

    const filename = (titleInput.value || 'poetry-poster')
      .replace(/[^a-z0-9]+/gi,'-')
      .replace(/^-+|-+$/g,'')
      .toLowerCase() + '.png';

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

    setTimeout(()=>{
      a.remove();
      URL.revokeObjectURL(url);
    },1500);

  }catch(err){
    console.error('PNG export failed:',err);
    alert('PNG export failed: ' + (err.message || err));
  }finally{
    button.disabled = false;
    button.textContent = originalText;
  }
};
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block';installBtn.onclick=async()=>{deferredPrompt.prompt();deferredPrompt=null}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();listSaved();
</script></body></html>
